[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "tracksplit-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pydub>=0.25",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "supabase>=2.0",
    "modal>=0.64",
]

# Separation runs on Modal, whose image carries its own torch/demucs. Only install
# these to run the local CPU fallback: pip install -e ".[local-separation]"
[project.optional-dependencies]
local-separation = [
    "demucs>=4.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    # Neither torch nor demucs declares numpy, so it installs clean and then fails
    # at import. Held below 2.x because demucs 4.x and its museval/openunmix
    # dependencies predate the numpy 2 API changes.
    "numpy<2",
    # demucs reads and writes audio through soundfile on several paths.
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
